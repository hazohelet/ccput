name: repack

on:
  schedule:
    - cron: "26 2 * * *"
  workflow_dispatch:
    inputs:
      families:
        description: "families to repack (space separated, empty for all)"
        type: string
        default: ""
      tag:
        description: "nightly release to write to (default: today, UTC) -- set it to fill in a missed day"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: repack
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      nightly: ${{ steps.plan.outputs.nightly }}
      cross: ${{ steps.plan.outputs.cross }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      build_any: ${{ steps.plan.outputs.build_any }}
      clang_matrix: ${{ steps.plan.outputs.clang_matrix }}
      clang_any: ${{ steps.plan.outputs.clang_any }}
      gcc_commit: ${{ steps.pins.outputs.gcc }}
      llvm_commit: ${{ steps.pins.outputs.llvm }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Pin the trunk commits
        id: pins
        run: |
          {
            echo "gcc=$(git ls-remote https://github.com/gcc-mirror/gcc.git HEAD | cut -f1)"
            echo "llvm=$(git ls-remote https://github.com/llvm/llvm-project.git HEAD | cut -f1)"
          } >> "$GITHUB_OUTPUT"
      - name: What the bucket holds
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export CCPUT_RELEASES="$(
            gh release list --json tagName --limit 1000 -q '.[].tagName' | tr '\n' ' '
          )"
          ./repack.py plan --tag "${{ inputs.tag }}" ${{ inputs.families }}
      - name: Create the nightly release
        if: steps.plan.outputs.nightly == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.plan.outputs.tag }}'
          notes="Trunk clang from Compiler Explorer's nightly bucket is repacked to the parts a C compile touches. Trunk gcc — the host and every cross target — is built here from GCC trunk with C and LTO only and --enable-checking=yes, using Ubuntu 24.04's own compiler for the host and its cross binutils and libc packages for each target's tools and sysroot. Each asset carries provenance.json naming its exact source; manifest.json indexes the release. gcc and binutils are GPLv3 — the source of a gcc build is the gcc git tree at its gcc_revision (https://gcc.gnu.org/git/?p=gcc.git;a=commit;h=<gcc_revision>), each gcc archive carries build.log.bz2 with its configure/build details and the share/licenses/ tree for the packages it consumed. clang is Apache-2.0 — LLVM's LICENSE.TXT ships inside each clang archive."
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "nightlies $tag" \
            --notes "$notes"

  qemu:
    needs: plan
    if: needs.plan.outputs.cross == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Build the pinned qemu-user set
        run: |
          nix build .#qemu-user -o "$PWD/qemu-out"
          out=$(readlink -f "$PWD/qemu-out")
          echo "$out" > out-path
          nix path-info -r "$out" | sed 's|^/nix/store/||' > paths.txt
          sudo tar -cf qemu-store.tar -C /nix/store --files-from paths.txt
          zstd -T0 -q qemu-store.tar
      - uses: actions/upload-artifact@v7
        with:
          name: qemu-store
          path: |
            qemu-store.tar.zst
            out-path
          retention-days: 1

  repack:
    needs: [plan, qemu]
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Repack ${{ matrix.family }}-${{ matrix.build }}
        run: ./repack.py repack "${{ matrix.family }}" "${{ matrix.build }}" --tag "${{ matrix.tag }}"
      - uses: actions/download-artifact@v8
        with:
          name: qemu-store
          path: qemu
      - name: Unpack the pinned qemu
        run: |
          sudo mkdir -p /nix/store
          sudo tar -xf qemu/qemu-store.tar.zst -C /nix/store
          echo "CCPUT_QEMU=$(cat qemu/out-path)/bin" >> "$GITHUB_ENV"
      - name: Check the result compiles, links and runs a program
        run: python3 selfcheck.py "${{ matrix.family }}" "${{ matrix.build }}"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ matrix.tag }}'
          if [ "${{ matrix.kind }}" = stable ]; then
            notes="Stable ${{ matrix.family }} ${{ matrix.build }} from Compiler Explorer's bucket, repacked to the parts a C compile touches; no compiler is built here. The archive carries a provenance.json naming its exact source, and manifest.json indexes the release. Licenses as in the nightly releases: GPLv3 for gcc and binutils (each cross archive carries the upstream build.log.bz2 and share/licenses/), Apache-2.0 for clang (LLVM's LICENSE.TXT ships inside)."
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
              --title "${{ matrix.family }} ${{ matrix.build }}" \
              --notes "$notes"
          fi
          gh release upload "$tag" \
            "dist/${{ matrix.family }}-${{ matrix.build }}.tar.xz" --clobber
          if [ "${{ matrix.kind }}" = stable ]; then
            ./repack.py manifest "$tag"
            gh release upload "$tag" dist/manifest.json --clobber
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: record-${{ matrix.family }}-${{ matrix.build }}
          path: dist/${{ matrix.family }}-${{ matrix.build }}.record.json
          retention-days: 1

  build-gcc:
    needs: plan
    if: needs.plan.outputs.build_any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      FAMILY: ${{ matrix.family }}
      TARGET: ${{ matrix.target }}
      CROSS: ${{ matrix.cross }}
      DRIVER: ${{ matrix.driver }}
      ARCH_FLAGS: ${{ join(matrix.arch, ' ') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: gcc-mirror/gcc
          # pinned by the plan job so every family builds the same commit
          ref: ${{ needs.plan.outputs.gcc_commit }}
          path: gcc
          fetch-depth: 1
      - name: Install the build tools and the Ubuntu cross toolchain
        run: |
          sudo apt-get update
          pkgs="build-essential bison flex gawk texinfo zlib1g-dev patchelf"
          if [ -n "$CROSS" ]; then
            pkgs="$pkgs binutils-$TARGET libc6-dev-$CROSS-cross"
          fi
          sudo apt-get install -y $pkgs
          if [ -n "$CROSS" ]; then
            dpkg-query -W -f='${Package} ${Version}\n' \
              "binutils-$TARGET" "libc6-dev-$CROSS-cross" "libc6-$CROSS-cross" \
              > ubuntu-cross.txt
          fi
      - name: Fetch GCC's pinned build prerequisites
        run: cd gcc && ./contrib/download_prerequisites
      - name: Build the assertions-enabled C compiler
        run: .github/scripts/build-gcc.sh
      - name: Package only what C compilation needs
        env:
          BUILD: ${{ needs.plan.outputs.tag }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: python3 .github/scripts/package-gcc.py
      - uses: actions/upload-artifact@v7
        with:
          name: built-${{ matrix.family }}-${{ needs.plan.outputs.tag }}
          path: |
            dist/${{ matrix.family }}-${{ needs.plan.outputs.tag }}.tar.xz
            dist/${{ matrix.family }}-${{ needs.plan.outputs.tag }}.record.json
          retention-days: 1

  build-clang:
    needs: plan
    if: needs.plan.outputs.clang_any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.clang_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      FAMILY: ${{ matrix.family }}
      DRIVER: ${{ matrix.driver }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: llvm/llvm-project
          # pinned by the plan job
          ref: ${{ needs.plan.outputs.llvm_commit }}
          path: llvm
          fetch-depth: 1
      - name: Install the build tools
        run: sudo apt-get update && sudo apt-get install -y
          build-essential cmake ninja-build python3 zlib1g-dev
      - name: Build the assertions-enabled clang
        run: .github/scripts/build-clang.sh
      - name: Package only what C compilation needs
        env:
          BUILD: ${{ needs.plan.outputs.tag }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: python3 .github/scripts/package-clang.py
      - uses: actions/upload-artifact@v7
        with:
          name: built-${{ matrix.family }}-${{ needs.plan.outputs.tag }}
          path: |
            dist/${{ matrix.family }}-${{ needs.plan.outputs.tag }}.tar.xz
            dist/${{ matrix.family }}-${{ needs.plan.outputs.tag }}.record.json
          retention-days: 1

  check-clang:
    needs: [plan, build-clang]
    if: always() && needs.plan.outputs.clang_any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.clang_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FAMILY: ${{ matrix.family }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the build
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: built-${{ matrix.family }}-${{ needs.plan.outputs.tag }}
          path: dist
      - name: Note the missing build
        if: steps.fetch.outcome != 'success'
        run: echo "::notice::no build artifact for $FAMILY; its build leg failed"
      - name: Check the result compiles, links and runs a program
        if: steps.fetch.outcome == 'success'
        run: python3 selfcheck.py "$FAMILY" "${{ needs.plan.outputs.tag }}"
      - name: Upload to the nightly release
        if: steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ needs.plan.outputs.tag }}' \
            "dist/${FAMILY}-${{ needs.plan.outputs.tag }}.tar.xz" --clobber
      - uses: actions/upload-artifact@v7
        if: steps.fetch.outcome == 'success'
        with:
          name: record-${{ matrix.family }}
          path: dist/${{ matrix.family }}-${{ needs.plan.outputs.tag }}.record.json
          retention-days: 1

  check-gcc:
    needs: [plan, qemu, build-gcc]
    if: always() && needs.plan.outputs.build_any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FAMILY: ${{ matrix.family }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the build
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: built-${{ matrix.family }}-${{ needs.plan.outputs.tag }}
          path: dist
      - name: Note the missing build
        if: steps.fetch.outcome != 'success'
        run: echo "::notice::no build artifact for $FAMILY; its build leg failed"
      - uses: actions/download-artifact@v8
        if: matrix.cross != '' && steps.fetch.outcome == 'success'
        with:
          name: qemu-store
          path: qemu
      - name: Unpack the pinned qemu
        if: matrix.cross != '' && steps.fetch.outcome == 'success'
        run: |
          sudo mkdir -p /nix/store
          sudo tar -xf qemu/qemu-store.tar.zst -C /nix/store
          echo "CCPUT_QEMU=$(cat qemu/out-path)/bin" >> "$GITHUB_ENV"
      - name: Check the result compiles, links and runs a program
        if: steps.fetch.outcome == 'success'
        run: python3 selfcheck.py "$FAMILY" "${{ needs.plan.outputs.tag }}"
      - name: Upload to the nightly release
        if: steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ needs.plan.outputs.tag }}' \
            "dist/${FAMILY}-${{ needs.plan.outputs.tag }}.tar.xz" --clobber
      - uses: actions/upload-artifact@v7
        if: steps.fetch.outcome == 'success'
        with:
          name: record-${{ matrix.family }}
          path: dist/${{ matrix.family }}-${{ needs.plan.outputs.tag }}.record.json
          retention-days: 1

  publish:
    needs: [plan, repack, check-gcc, check-clang]
    if: always() && needs.plan.outputs.nightly == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: record-*
          merge-multiple: true
      - name: Index the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ needs.plan.outputs.tag }}'
          if ! ls dist/*.record.json >/dev/null 2>&1; then
            echo "no archives were published into $tag; nothing to index"
            exit 0
          fi
          ./repack.py manifest "$tag"
          gh release upload "$tag" dist/manifest.json --clobber
