name: build

on:
  schedule:
    - cron: "26 2 * * *"
  workflow_dispatch:
    inputs:
      select:
        description: "builds to make (space separated: <family>-trunk, <family> for every stable version, <family>-<X.Y.Z>; empty for all)"
        type: string
        default: ""
      tag:
        description: "nightly release to write to (default: today, UTC) -- set it to fill in a missed day"
        type: string
        default: ""
      rebuild:
        description: "rebuild selected stable versions even if already released"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      gcc_matrix: ${{ steps.plan.outputs.gcc_matrix }}
      gcc_any: ${{ steps.plan.outputs.gcc_any }}
      clang_matrix: ${{ steps.plan.outputs.clang_matrix }}
      clang_any: ${{ steps.plan.outputs.clang_any }}
      cross: ${{ steps.plan.outputs.cross }}
      nightly: ${{ steps.plan.outputs.nightly }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Pin trunk and list the stable releases still to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SELECT: ${{ inputs.select }}
          REBUILD: ${{ inputs.rebuild && '--rebuild' || '' }}
        run: |
          # Assigned on its own line so a failed listing stops the run rather
          # than planning every stable version as unreleased.
          releases=$(gh release list --json tagName --limit 1000 -q '.[].tagName')
          export CCPUT_RELEASES="${releases//$'\n'/ }"
          # SELECT is a space-separated list of family selectors.
          # shellcheck disable=SC2086
          ./ccput.py plan --tag "$TAG" $REBUILD $SELECT
      - name: Create the nightly release
        if: steps.plan.outputs.nightly == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.plan.outputs.tag }}'
          notes="Trunk gcc and clang, built here from upstream source at the commits each asset's provenance.json names. gcc -- the host and every cross target -- is built with C and LTO only and --enable-checking=yes,extra,rtl, using Ubuntu 24.04's own compiler for the host and its cross binutils and libc packages for each target's tools and sysroot. clang is built Release with LLVM_ENABLE_ASSERTIONS=ON and compiler-rt. manifest.json indexes the release. gcc and binutils are GPLv3 -- the source of a gcc build is the gcc git tree at its gcc_revision (https://gcc.gnu.org/git/?p=gcc.git;a=commit;h=<gcc_revision>), each gcc archive carries build.log.bz2 with its configure/build details and the share/licenses/ tree for the packages it consumed. clang is Apache-2.0 -- LLVM's LICENSE.TXT ships inside each clang archive."
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "nightlies $tag" \
            --notes "$notes"

  qemu:
    needs: plan
    if: needs.plan.outputs.cross == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Build the pinned qemu-user set
        run: |
          nix build .#qemu-user -o "$PWD/qemu-out"
          out=$(readlink -f "$PWD/qemu-out")
          echo "$out" > out-path
          nix path-info -r "$out" | sed 's|^/nix/store/||' > paths.txt
          sudo tar -cf qemu-store.tar -C /nix/store --files-from paths.txt
          zstd -T0 -q qemu-store.tar
      - uses: actions/upload-artifact@v7
        with:
          name: qemu-store
          path: |
            qemu-store.tar.zst
            out-path
          retention-days: 1

  build-gcc:
    name: build ${{ matrix.family }}-${{ matrix.build }}
    needs: plan
    if: needs.plan.outputs.gcc_any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.gcc_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      FAMILY: ${{ matrix.family }}
      TARGET: ${{ matrix.target }}
      CROSS: ${{ matrix.cross }}
      DRIVER: ${{ matrix.driver }}
      ARCH_FLAGS: ${{ join(matrix.arch, ' ') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: gcc-mirror/gcc
          # a release tag, or the trunk commit the plan job pinned for every
          # nightly family
          ref: ${{ matrix.ref }}
          path: gcc
          fetch-depth: 1
      - name: Install the build tools and the Ubuntu cross toolchain
        run: |
          sudo apt-get update
          pkgs="build-essential bison flex gawk zlib1g-dev patchelf"
          if [ -n "$CROSS" ]; then
            pkgs="$pkgs binutils-$TARGET libc6-dev-$CROSS-cross"
          fi
          sudo apt-get install -y $pkgs
          if [ -n "$CROSS" ]; then
            dpkg-query -W -f='${Package} ${Version}\n' \
              "binutils-$TARGET" "libc6-dev-$CROSS-cross" "libc6-$CROSS-cross" \
              > ubuntu-cross.txt
          fi
      - name: Fetch GCC's pinned build prerequisites
        run: |
          # Older releases fetch them over ftp://, which the runners cannot
          # rely on; the same files are served over https.
          sed -i 's|ftp://gcc\.gnu\.org/|https://gcc.gnu.org/|' gcc/contrib/download_prerequisites
          cd gcc && ./contrib/download_prerequisites
      - name: Build the assertions-enabled C compiler
        run: .github/scripts/build-gcc.sh
      - name: Package only what C compilation needs
        env:
          BUILD: ${{ matrix.build }}
          TAG: ${{ matrix.tag }}
          REF: ${{ matrix.ref }}
        run: python3 .github/scripts/package-gcc.py
      - uses: actions/upload-artifact@v7
        with:
          name: built-${{ matrix.family }}-${{ matrix.build }}
          path: |
            dist/${{ matrix.family }}-${{ matrix.build }}.tar.xz
            dist/${{ matrix.family }}-${{ matrix.build }}.record.json
          retention-days: 1

  build-clang:
    name: build ${{ matrix.family }}-${{ matrix.build }}
    needs: plan
    if: needs.plan.outputs.clang_any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.clang_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      FAMILY: ${{ matrix.family }}
      DRIVER: ${{ matrix.driver }}
      KIND: ${{ matrix.kind }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: llvm/llvm-project
          # a release tag, or the trunk commit the plan job pinned
          ref: ${{ matrix.ref }}
          path: llvm
          fetch-depth: 1
      - name: Install the build tools
        run: sudo apt-get update && sudo apt-get install -y
          build-essential gcc-14 g++-14 cmake ninja-build python3 zlib1g-dev
      - name: Build the assertions-enabled clang
        run: .github/scripts/build-clang.sh
      - name: Package only what C compilation needs
        env:
          BUILD: ${{ matrix.build }}
          TAG: ${{ matrix.tag }}
          REF: ${{ matrix.ref }}
        run: python3 .github/scripts/package-clang.py
      - uses: actions/upload-artifact@v7
        with:
          name: built-${{ matrix.family }}-${{ matrix.build }}
          path: |
            dist/${{ matrix.family }}-${{ matrix.build }}.tar.xz
            dist/${{ matrix.family }}-${{ matrix.build }}.record.json
          retention-days: 1

  check-gcc:
    name: check ${{ matrix.family }}-${{ matrix.build }}
    needs: [plan, qemu, build-gcc]
    if: always() && needs.plan.outputs.gcc_any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.gcc_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FAMILY: ${{ matrix.family }}
      BUILD: ${{ matrix.build }}
      TAG: ${{ matrix.tag }}
      KIND: ${{ matrix.kind }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the build
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: built-${{ matrix.family }}-${{ matrix.build }}
          path: dist
      - name: Note the missing build
        if: steps.fetch.outcome != 'success'
        run: |
          echo "::error::no build artifact for $FAMILY-$BUILD; its build leg failed"
          exit 1
      - uses: actions/download-artifact@v8
        if: matrix.cross != ''
        with:
          name: qemu-store
          path: qemu
      - name: Unpack the pinned qemu
        if: matrix.cross != ''
        run: |
          sudo mkdir -p /nix/store
          sudo tar -xf qemu/qemu-store.tar.zst -C /nix/store
          echo "CCPUT_QEMU=$(cat qemu/out-path)/bin" >> "$GITHUB_ENV"
      - name: Check the result compiles, links and runs a program
        run: python3 selfcheck.py "$FAMILY" "$BUILD"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish.sh
      - uses: actions/upload-artifact@v7
        with:
          name: record-${{ matrix.family }}-${{ matrix.build }}
          path: dist/${{ matrix.family }}-${{ matrix.build }}.record.json
          retention-days: 1

  check-clang:
    name: check ${{ matrix.family }}-${{ matrix.build }}
    needs: [plan, build-clang]
    if: always() && needs.plan.outputs.clang_any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.clang_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FAMILY: ${{ matrix.family }}
      BUILD: ${{ matrix.build }}
      TAG: ${{ matrix.tag }}
      KIND: ${{ matrix.kind }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the build
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: built-${{ matrix.family }}-${{ matrix.build }}
          path: dist
      - name: Note the missing build
        if: steps.fetch.outcome != 'success'
        run: |
          echo "::error::no build artifact for $FAMILY-$BUILD; its build leg failed"
          exit 1
      - name: Check the result compiles, links and runs a program
        run: python3 selfcheck.py "$FAMILY" "$BUILD"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish.sh
      - uses: actions/upload-artifact@v7
        with:
          name: record-${{ matrix.family }}-${{ matrix.build }}
          path: dist/${{ matrix.family }}-${{ matrix.build }}.record.json
          retention-days: 1

  publish:
    needs: [plan, check-gcc, check-clang]
    if: always() && needs.plan.outputs.nightly == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: record-*
          merge-multiple: true
      - name: Index the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ needs.plan.outputs.tag }}'
          if ! grep -lq "\"tag\": \"$tag\"" dist/*.record.json 2>/dev/null; then
            echo "no archives were published into $tag; nothing to index"
            exit 0
          fi
          # Seed the merge with the manifest already on the release, so a
          # partial run extends the index instead of shrinking it.
          gh release download "$tag" --pattern manifest.json --dir dist || true
          ./ccput.py manifest "$tag"
          gh release upload "$tag" dist/manifest.json --clobber
