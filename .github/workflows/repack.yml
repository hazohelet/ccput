name: repack

on:
  schedule:
    - cron: "26 8 * * *"
  workflow_dispatch:
    inputs:
      families:
        description: "families to repack (space separated, empty for all)"
        type: string
        default: ""
      tag:
        description: "nightly release to write to (default: today, UTC) -- set it to fill in a missed day"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: repack
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      nightly: ${{ steps.plan.outputs.nightly }}
      cross: ${{ steps.plan.outputs.cross }}
      build_loongarch64: ${{ steps.plan.outputs.build_loongarch64 }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: What the bucket holds
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export CCPUT_RELEASES="$(
            gh release list --json tagName --limit 1000 -q '.[].tagName' | tr '\n' ' '
          )"
          ./repack.py plan --tag "${{ inputs.tag }}" ${{ inputs.families }}
      - name: Create the nightly release
        if: steps.plan.outputs.nightly == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.plan.outputs.tag }}'
          notes="Trunk gcc and clang from Compiler Explorer's nightly bucket are repacked to the parts a C compile touches. loongarch64-gcc-assertions-trunk is built here from GCC trunk with C and LTO only and --enable-checking=yes, using the pinned Compiler Explorer LoongArch toolchain for binutils and its sysroot. Each asset carries provenance.json naming its exact source; manifest.json indexes the release. gcc and binutils are GPLv3 — the source of a gcc build is the gcc git tree at its gcc_revision (https://gcc.gnu.org/git/?p=gcc.git;a=commit;h=<gcc_revision>), and each cross gcc archive carries build.log.bz2 with its configure/build details. clang is Apache-2.0 — LLVM's LICENSE.TXT ships inside each clang archive, and the share/licenses/ trees inside the cross gcc archives. The host gcc-trunk build ships no license file upstream; it is GPLv3: https://www.gnu.org/licenses/gpl-3.0.html"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "nightlies $tag" \
            --notes "$notes"

  qemu:
    needs: plan
    if: needs.plan.outputs.cross == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Build the pinned qemu-user set
        run: |
          nix build .#qemu-user -o "$PWD/qemu-out"
          out=$(readlink -f "$PWD/qemu-out")
          echo "$out" > out-path
          nix path-info -r "$out" | sed 's|^/nix/store/||' > paths.txt
          sudo tar -cf qemu-store.tar -C /nix/store --files-from paths.txt
          zstd -T0 -q qemu-store.tar
      - uses: actions/upload-artifact@v7
        with:
          name: qemu-store
          path: |
            qemu-store.tar.zst
            out-path
          retention-days: 1

  repack:
    needs: [plan, qemu]
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Repack ${{ matrix.family }}-${{ matrix.build }}
        run: ./repack.py repack "${{ matrix.family }}" "${{ matrix.build }}" --tag "${{ matrix.tag }}"
      - uses: actions/download-artifact@v8
        with:
          name: qemu-store
          path: qemu
      - name: Unpack the pinned qemu
        run: |
          sudo mkdir -p /nix/store
          sudo tar -xf qemu/qemu-store.tar.zst -C /nix/store
          echo "CCPUT_QEMU=$(cat qemu/out-path)/bin" >> "$GITHUB_ENV"
      - name: Check the result compiles, links and runs a program
        run: python3 selfcheck.py "${{ matrix.family }}" "${{ matrix.build }}"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ matrix.tag }}'
          if [ "${{ matrix.kind }}" = stable ]; then
            notes="Stable ${{ matrix.family }} ${{ matrix.build }} from Compiler Explorer's bucket, repacked to the parts a C compile touches; no compiler is built here. The archive carries a provenance.json naming its exact source, and manifest.json indexes the release. Licenses as in the nightly releases: GPLv3 for gcc and binutils (each cross archive carries the upstream build.log.bz2 and share/licenses/), Apache-2.0 for clang (LLVM's LICENSE.TXT ships inside)."
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
              --title "${{ matrix.family }} ${{ matrix.build }}" \
              --notes "$notes"
          fi
          gh release upload "$tag" \
            "dist/${{ matrix.family }}-${{ matrix.build }}.tar.xz" --clobber
          if [ "${{ matrix.kind }}" = stable ]; then
            ./repack.py manifest "$tag"
            gh release upload "$tag" dist/manifest.json --clobber
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: record-${{ matrix.family }}-${{ matrix.build }}
          path: dist/${{ matrix.family }}-${{ matrix.build }}.record.json
          retention-days: 1

  build-loongarch64:
    needs: plan
    if: needs.plan.outputs.build_loongarch64 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TARGET: loongarch64-unknown-linux-gnu
      FAMILY: loongarch64-gcc-assertions-trunk
      BOOTSTRAP_VERSION: 16.1.0
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: actions/checkout@v7
        with:
          repository: gcc-mirror/gcc
          path: gcc
          fetch-depth: 1
      - name: Fetch GCC's pinned build prerequisites
        run: nix develop .#gcc-loongarch64 --command bash -c 'cd gcc && ./contrib/download_prerequisites'
      - name: Fetch the pinned LoongArch binutils and sysroot
        run: |
          url="https://compiler-explorer.s3.amazonaws.com/opt/loongarch64-gcc-${BOOTSTRAP_VERSION}.tar.xz"
          curl --fail --location --retry 3 --output bootstrap.tar.xz "$url"
          mkdir bootstrap
          tar -xf bootstrap.tar.xz -C bootstrap
          sha256sum bootstrap.tar.xz > bootstrap.sha256
      - name: Install libfl for the bootstrap ar and ranlib
        run: sudo apt-get update && sudo apt-get install -y libfl2
      - name: Build the assertions-enabled C compiler
        run: nix develop .#gcc-loongarch64 --command .github/scripts/build-loongarch64-gcc.sh
      - name: Package only what C compilation needs
        env:
          BUILD: ${{ needs.plan.outputs.tag }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: python3 .github/scripts/package-loongarch64-gcc.py
      - uses: actions/upload-artifact@v7
        with:
          name: built-loongarch64-gcc-assertions-trunk-${{ needs.plan.outputs.tag }}
          path: |
            dist/loongarch64-gcc-assertions-trunk-${{ needs.plan.outputs.tag }}.tar.xz
            dist/loongarch64-gcc-assertions-trunk-${{ needs.plan.outputs.tag }}.record.json
          retention-days: 1

  check-loongarch64:
    needs: [plan, qemu, build-loongarch64]
    if: needs.plan.outputs.build_loongarch64 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FAMILY: loongarch64-gcc-assertions-trunk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: built-loongarch64-gcc-assertions-trunk-${{ needs.plan.outputs.tag }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: qemu-store
          path: qemu
      - name: Unpack the pinned qemu
        run: |
          sudo mkdir -p /nix/store
          sudo tar -xf qemu/qemu-store.tar.zst -C /nix/store
          echo "CCPUT_QEMU=$(cat qemu/out-path)/bin" >> "$GITHUB_ENV"
      - name: Check the result compiles, links and runs a program
        run: python3 selfcheck.py "$FAMILY" "${{ needs.plan.outputs.tag }}"
      - name: Upload to the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ needs.plan.outputs.tag }}' \
            "dist/${FAMILY}-${{ needs.plan.outputs.tag }}.tar.xz" --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: record-loongarch64-gcc-assertions-trunk-${{ needs.plan.outputs.tag }}
          path: dist/loongarch64-gcc-assertions-trunk-${{ needs.plan.outputs.tag }}.record.json
          retention-days: 1

  publish:
    needs: [plan, repack, check-loongarch64]
    if: always() && needs.plan.outputs.nightly == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: record-*
          merge-multiple: true
      - name: Index the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ needs.plan.outputs.tag }}'
          if ! ls dist/*.record.json >/dev/null 2>&1; then
            echo "no archives were published into $tag; nothing to index"
            exit 0
          fi
          ./repack.py manifest "$tag"
          gh release upload "$tag" dist/manifest.json --clobber
